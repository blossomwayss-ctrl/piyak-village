<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5ec2ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이든 히어로">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="이든 히어로 출동!">
<meta property="og:description" content="손가락으로 하늘을 날며 별을 모으고 친구를 구하는 5살 히어로 게임">
<meta property="og:image" content="https://blossomwayss-ctrl.github.io/piyak-village/eden-hero/og.png">
<meta property="og:url" content="https://blossomwayss-ctrl.github.io/piyak-village/eden-hero/">
<title>이든 히어로 출동!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5ec2ff; color: #2b2550; touch-action: manipulation;
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
  button { font-family: inherit; color: #2b2550; touch-action: manipulation; }
  .hidden { display: none !important; }
  #game { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .screen.show { display: flex; }

  .ol2 { text-shadow: 2px 2px 0 #2b2550, -2px 2px 0 #2b2550, 2px -2px 0 #2b2550, -2px -2px 0 #2b2550, 0 2px 0 #2b2550, 0 -2px 0 #2b2550, 2px 0 0 #2b2550, -2px 0 0 #2b2550; }
  .ol4 { text-shadow: 4px 4px 0 #2b2550, -4px 4px 0 #2b2550, 4px -4px 0 #2b2550, -4px -4px 0 #2b2550, 0 4px 0 #2b2550, 0 -4px 0 #2b2550, 4px 0 0 #2b2550, -4px 0 0 #2b2550, 0 7px 0 rgba(43,37,80,.25); }

  /* ---------- 타이틀 ---------- */
  #title { justify-content: space-between; padding: 7vh 16px 9vh; }
  .title-wrap { text-align: center; }
  .title-sub { font-size: 4.6vmin; font-size: clamp(20px, 4.6vmin, 36px); color: #fff; }
  .title-main { margin: 0; font-weight: 400; line-height: 1.05; font-size: 13.5vmin; font-size: clamp(50px, 13.5vmin, 128px); color: #fff; letter-spacing: 1px; }
  .title-main .nm { color: #ffd93d; }
  .play-btn { width: 21vmin; height: 21vmin; width: clamp(96px, 21vmin, 156px); height: clamp(96px, 21vmin, 156px);
    border-radius: 50%; background: #ffd93d; border: 5px solid #2b2550; box-shadow: 0 8px 0 #2b2550;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    -webkit-animation: pulse 1.3s ease-in-out infinite; animation: pulse 1.3s ease-in-out infinite; }
  .play-btn svg { width: 46%; height: 46%; margin-left: 9%; }
  .play-btn:active { -webkit-transform: translateY(5px); transform: translateY(5px); box-shadow: 0 3px 0 #2b2550; -webkit-animation: none; animation: none; }
  .corner-btn { position: absolute; right: 12px; bottom: 12px; font-size: 14px; padding: 6px 12px; border-radius: 999px;
    border: 2px solid #2b2550; background: rgba(255,255,255,.85); cursor: pointer; }
  .small-btn { font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 2px solid #2b2550; background: #fff; background: rgba(255,255,255,.85);
    cursor: pointer; position: relative; overflow: hidden; }
  .small-btn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,183,3,.55); }
  .small-btn span { position: relative; }
  .parent-btn { position: absolute; left: 12px; bottom: 12px; }
  .install-btn { display: flex; align-items: center; font-size: 18px; padding: 7px 16px 7px 12px;
    border-radius: 999px; border: 3px solid #2b2550; background: #fff; box-shadow: 0 4px 0 rgba(43,37,80,.25); cursor: pointer;
    -webkit-animation: pulse 1.6s ease-in-out infinite; animation: pulse 1.6s ease-in-out infinite; }
  .install-btn svg { width: 24px; height: 24px; margin-right: 6px; }
  @-webkit-keyframes pulse { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.07); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  /* ---------- 공통 카드 · 버튼 ---------- */
  .card { background: #fff; background: rgba(255,255,255,.96); border: 4px solid #2b2550; border-radius: 28px;
    padding: 2.6vmin; padding: clamp(10px, 2.6vmin, 24px); box-shadow: 0 8px 0 rgba(43,37,80,.28);
    max-width: 96vw; max-width: min(96vw, 800px); max-height: 96vh; overflow: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center; }
  .card > * + * { margin-top: 1.8vmin; margin-top: clamp(6px, 1.8vmin, 16px); }
  .card h2 { margin: 0; font-weight: 400; font-size: 4.8vmin; font-size: clamp(22px, 4.8vmin, 38px); }
  .btn { font-size: 17px; padding: 7px 16px; border-radius: 999px; border: 3px solid #2b2550; background: #fff; cursor: pointer; color: #2b2550; }
  .btn.primary { background: #ff6b6b; color: #fff; box-shadow: 0 4px 0 #2b2550; }
  .btn.on { background: #ffd93d; }
  .btn.danger { background: #ffe3e3; }
  .btn[disabled] { opacity: .4; }
  @-webkit-keyframes shake { 0%,100% { -webkit-transform: translateX(0); } 25% { -webkit-transform: translateX(-5px); } 75% { -webkit-transform: translateX(5px); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .shake { -webkit-animation: shake .3s 2; animation: shake .3s 2; }

  /* ---------- 히어로 꾸미기 ---------- */
  .maker-body { display: flex; align-items: center; }
  .maker-body > * + * { margin-left: 3vmin; }
  #preview { width: 33vmin; height: 38.8vmin; width: clamp(120px, 33vmin, 250px); height: clamp(141px, 38.8vmin, 294px);
    border-radius: 24px; border: 3px solid #2b2550; background: #e3f3ff;
    background: radial-gradient(circle at 50% 58%, #eaf7ff 0%, #eaf7ff 52%, #cfeaff 53%, #cfeaff 100%); flex: none; }
  .opts { display: flex; flex-direction: column; }
  .opts > * + * { margin-top: 1.5vmin; }
  .row { display: flex; flex-wrap: nowrap; align-items: center; }
  .row > * + * { margin-left: 1.3vmin; }
  @media (max-width: 359px) { .row { flex-wrap: wrap; } }
  .lab { font-size: 2.5vmin; font-size: clamp(13px, 2.5vmin, 18px); width: 2.4em; color: #6b6496; flex: none; }
  .opt { position: relative; width: 9.2vmin; height: 9.2vmin; width: clamp(44px, 9.2vmin, 64px); height: clamp(44px, 9.2vmin, 64px);
    border-radius: 18px; border: 3px solid #2b2550; background: #fff; cursor: pointer; padding: 0; flex: none;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(43,37,80,.22); }
  .opt svg { width: 64%; height: 64%; }
  .opt.color { border-radius: 50%; }
  .opt.sel { box-shadow: 0 0 0 3px #fff, 0 0 0 7px #ffb703; -webkit-transform: scale(1.08); transform: scale(1.08); }
  .opt.wear { width: auto; padding: 0 10px; font-size: 2.6vmin; font-size: clamp(13px, 2.6vmin, 19px); }
  .opt.wear > * + * { margin-left: 4px; }
  .opt.wear svg { width: 5.4vmin; height: 5.4vmin; width: clamp(24px, 5.4vmin, 38px); height: clamp(24px, 5.4vmin, 38px); }
  .opt.locked { opacity: .55; }
  .opt.locked svg { opacity: .45; }
  .opt .lk { position: absolute; right: -7px; bottom: -8px; background: #fff; border: 2px solid #2b2550; border-radius: 99px; font-size: 11px;
    padding: 0 5px; line-height: 16px; white-space: nowrap; color: #2b2550; }
  .opt.new:after { content: ''; position: absolute; right: -5px; top: -5px; width: 13px; height: 13px; border-radius: 50%; background: #ff3b5c; border: 2px solid #fff; }
  .namebox { display: flex; align-items: center; font-size: 2.5vmin; font-size: clamp(13px, 2.5vmin, 18px); color: #6b6496; }
  .namebox > * + * { margin-left: 8px; }
  .namebox input { font-family: inherit; font-size: 3.4vmin; font-size: clamp(18px, 3.4vmin, 24px); width: 6.2em; padding: 4px 10px;
    border: 3px solid #2b2550; border-radius: 12px; color: #2b2550; -webkit-user-select: text; user-select: text; }
  .mk-btns { display: flex; align-items: center; }
  .mk-btns > * + * { margin-left: 14px; }
  .big-btn { font-size: 6.4vmin; font-size: clamp(28px, 6.4vmin, 46px); padding: 1.4vmin 7vmin; padding: clamp(6px, 1.4vmin, 12px) clamp(30px, 7vmin, 60px);
    background: #ff6b6b; color: #fff; border: 4px solid #2b2550; border-radius: 999px; box-shadow: 0 6px 0 #2b2550; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .big-btn:active, .mid-btn:active { -webkit-transform: translateY(4px); transform: translateY(4px); box-shadow: 0 2px 0 #2b2550; }
  .mid-btn { font-size: 3.6vmin; font-size: clamp(17px, 3.6vmin, 26px); padding: 8px 16px; background: #ffd93d; border: 4px solid #2b2550; border-radius: 999px;
    box-shadow: 0 5px 0 #2b2550; cursor: pointer; display: flex; align-items: center; }
  .mid-btn svg { width: 1.3em; height: 1.3em; margin-right: 6px; }
  @media (max-aspect-ratio: 1/1) {
    .maker-body { flex-direction: column; }
    .maker-body > * + * { margin-left: 0; margin-top: 2vmin; }
  }
  @media (max-height: 480px) {
    .card h2 { display: none; }
    .opt { width: 40px; height: 40px; }
    .opt.wear { width: auto; }
    .card > * + * { margin-top: 6px; }
    .opts > * + * { margin-top: 6px; }
    #preview { width: 116px; height: 136px; }
    .big-btn { font-size: 26px; padding: 4px 26px; }
    .mid-btn { font-size: 16px; padding: 4px 12px; }
  }

  /* ---------- 게임 화면 표시줄 ---------- */
  .hud { position: fixed; left: 0; right: 0; top: 0; display: none; justify-content: space-between; align-items: flex-start;
    padding: 10px 12px; pointer-events: none; z-index: 10; }
  .hud.show { display: flex; }
  .left-stack { display: flex; flex-direction: column; align-items: flex-start; }
  .left-stack > * + * { margin-top: 6px; }
  .pill { background: #fff; background: rgba(255,255,255,.9); border: 3px solid #2b2550; border-radius: 999px; padding: 3px 16px 3px 8px;
    display: flex; align-items: center; font-size: 5.2vmin; font-size: clamp(22px, 5.2vmin, 38px); box-shadow: 0 4px 0 rgba(43,37,80,.25); color: #2b2550; }
  .pill > * + * { margin-left: 6px; }
  .pill svg { width: 1.25em; height: 1.25em; }
  .pill.btnlike { pointer-events: auto; cursor: pointer; font-family: inherit; }
  .lvbar, .gbar { width: 26vmin; width: clamp(96px, 26vmin, 190px); height: 13px; border: 2px solid #2b2550; border-radius: 99px;
    background: rgba(255,255,255,.8); overflow: hidden; }
  .lvbar i, .gbar i { display: block; height: 100%; width: 0; background: #ffd93d; -webkit-transition: width .3s; transition: width .3s; }
  .gbar { width: 21vmin; width: clamp(70px, 21vmin, 160px); }
  .gbar i { background: #ff8fab; }
  .gift { display: flex; align-items: center; }
  .gift svg { width: 24px; height: 24px; margin-right: 4px; flex: none; }
  .right-btns { display: flex; }
  .right-btns > * + * { margin-left: 8px; }
  .round { pointer-events: auto; width: 9vmin; height: 9vmin; width: clamp(44px, 9vmin, 62px); height: clamp(44px, 9vmin, 62px);
    border-radius: 50%; border: 3px solid #2b2550; background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(43,37,80,.25); cursor: pointer; padding: 0; }
  .round svg { width: 60%; height: 60%; }
  .bump { -webkit-animation: bump .45s ease; animation: bump .45s ease; }
  @-webkit-keyframes bump { 0% { -webkit-transform: scale(1); } 40% { -webkit-transform: scale(1.25); } 100% { -webkit-transform: scale(1); } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* ---------- 히어로 기지 ---------- */
  .basebar { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: none; align-items: center; justify-content: space-between; padding: 10px 12px; }
  .basebar.show { display: flex; }
  .basebar .ttl { font-size: 6vmin; font-size: clamp(24px, 6vmin, 46px); color: #fff; }
  .basebar .pill { font-size: 18px; font-size: clamp(16px, 3.6vmin, 26px); padding: 4px 14px; }

  /* ---------- 보호자 메뉴 ---------- */
  .pcard { width: 94vw; max-width: 640px; align-items: stretch; text-align: left; }
  .phead { display: flex; align-items: center; justify-content: space-between; }
  .psec { border-top: 2px dashed #d6d2ee; padding-top: 10px; }
  .psec h3 { margin: 0 0 6px; font-weight: 400; font-size: 20px; }
  .seg { display: flex; flex-wrap: wrap; }
  .seg > * { margin: 0 6px 6px 0; }
  .note { font-size: 14px; color: #77729b; line-height: 1.45; margin: 4px 0 8px; }
  .vrow { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
  .vrow .vt { flex: 1; font-size: 16px; }
  .vrow .vt small { display: block; color: #8a85ad; font-size: 13px; }
  .vrow .btn { font-size: 14px; padding: 5px 10px; margin-left: 6px; flex: none; }
  .vrow .btn.rec { background: #ff6b6b; color: #fff; }
  .vrow .btn.recing { background: #2b2550; color: #fff; }

  /* ---------- 쉬는 화면 ---------- */
  #rest { justify-content: space-between; padding: 6vh 16px 5vh; }
  .rest-main { font-size: 9vmin; font-size: clamp(36px, 9vmin, 84px); color: #fff; text-align: center; line-height: 1.15; }
  #rest .title-sub { text-align: center; }

  /* ---------- 앱 설치 안내 ---------- */
  #install { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none; justify-content: center; padding: 12px; }
  #install.show { display: flex; }
  .sheet { background: #fff; border: 4px solid #2b2550; border-radius: 24px; box-shadow: 0 8px 0 rgba(43,37,80,.28); padding: 16px 18px;
    width: 100%; max-width: 560px; display: flex; flex-direction: column; }
  .sheet .top { display: flex; align-items: center; }
  .sheet canvas { width: 64px; height: 64px; border-radius: 16px; border: 2px solid #2b2550; flex: none; margin-right: 12px; }
  .sheet h3 { margin: 0; font-weight: 400; font-size: 21px; }
  .sheet p { margin: 4px 0 0; font-size: 15px; color: #4a4470; line-height: 1.45; }
  .sheet ol { margin: 10px 0 0; padding-left: 1.3em; font-size: 17px; line-height: 1.7; }
  .sheet b { font-weight: 400; color: #e8455b; }
  .sheet .btns { display: flex; justify-content: flex-end; margin-top: 12px; }
  .sheet .btns > * + * { margin-left: 8px; }
  .share-ic { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -0.25em; }

  #toast { position: fixed; left: 50%; top: 40%; opacity: 0; pointer-events: none; z-index: 30; white-space: nowrap;
    -webkit-transform: translate(-50%, -50%) scale(0); transform: translate(-50%, -50%) scale(0);
    font-size: 11vmin; font-size: clamp(36px, 10vmin, 104px); color: #fff;
    text-shadow: 3px 3px 0 #2b2550, -3px 3px 0 #2b2550, 3px -3px 0 #2b2550, -3px -3px 0 #2b2550, 0 3px 0 #2b2550, 0 -3px 0 #2b2550, 3px 0 0 #2b2550, -3px 0 0 #2b2550, 0 6px 0 #2b2550; }
  #toast.show { -webkit-animation: tpop .55s cubic-bezier(.2,1.6,.4,1) forwards; animation: tpop .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  #toast.hide { -webkit-animation: tout .35s ease forwards; animation: tout .35s ease forwards; }
  @-webkit-keyframes tpop { from { -webkit-transform: translate(-50%, -50%) scale(.2); opacity: 0; } to { -webkit-transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  @keyframes tpop { from { transform: translate(-50%, -50%) scale(.2); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  @-webkit-keyframes tout { from { -webkit-transform: translate(-50%, -50%) scale(1); opacity: 1; } to { -webkit-transform: translate(-50%, -60%) scale(.9); opacity: 0; } }
  @keyframes tout { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(-50%, -60%) scale(.9); opacity: 0; } }

  #err { position: fixed; left: 10px; right: 10px; bottom: 10px; display: none; z-index: 50; background: #fff; border: 3px solid #ff6b6b;
    border-radius: 14px; padding: 10px 14px; font-size: 15px; font-family: sans-serif; color: #2b2550; -webkit-user-select: text; user-select: text; }
  .nojs { position: fixed; left: 50%; top: 58%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); z-index: 30;
    width: 88vw; max-width: 640px; background: #fff; border: 4px solid #2b2550; border-radius: 24px; box-shadow: 0 8px 0 rgba(43,37,80,.28);
    padding: 18px 22px; color: #2b2550; font-size: 20px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
  .nojs b { display: block; font-size: 26px; color: #ff4d4d; margin-bottom: 6px; font-weight: 400; }
  .nojs ol { margin: 8px 0 0; padding-left: 1.3em; }
</style>
<noscript><style>.play-btn, .corner-btn, .parent-btn { display: none !important; }</style></noscript>
</head>
<body>
<canvas id="game"></canvas>

<!-- 타이틀 -->
<section id="title" class="screen show">
  <div class="title-wrap">
    <div class="title-sub ol2">하늘을 지키는</div>
    <h1 class="title-main ol4"><span class="nm" id="titleName">이든</span> 히어로</h1>
  </div>
  <button class="install-btn hidden" id="btnInstall">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2b2550" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="#cfeaff"/><path d="M12 7v8M8.8 11.8 12 15l3.2-3.2"/></svg>
    앱으로 설치
  </button>
  <button class="play-btn" id="btnStart" aria-label="시작">
    <svg viewBox="0 0 24 24"><path d="M5 3.5v17l15-8.5z" fill="#ff6b6b" stroke="#2b2550" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button class="small-btn parent-btn" id="btnParent"><i class="fill"></i><span>보호자 (길게 누르기)</span></button>
  <button class="corner-btn" id="btnFull">전체화면</button>
</section>

<!-- 히어로 꾸미기 -->
<section id="maker" class="screen">
  <div class="card">
    <h2>나만의 히어로 만들기</h2>
    <div class="maker-body">
      <canvas id="preview"></canvas>
      <div class="opts">
        <div class="row" id="rowColor"><span class="lab">색깔</span></div>
        <div class="row" id="rowMark"><span class="lab">마크</span></div>
        <div class="row" id="rowWear"><span class="lab">옷</span></div>
        <div class="row" id="rowDeco"><span class="lab">장식</span></div>
        <label class="namebox"><span class="lab">이름</span><input id="nameInput" maxlength="6" value="이든" autocomplete="off"></label>
      </div>
    </div>
    <div class="mk-btns">
      <button class="mid-btn" id="btnBase">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="#fff" stroke="#2b2550" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 18.2c-2.6-2-3.8-3.3-3.8-4.7 0-1.1.9-1.9 1.9-1.9.8 0 1.5.5 1.9 1.2.4-.7 1.1-1.2 1.9-1.2 1 0 1.9.8 1.9 1.9 0 1.4-1.2 2.7-3.8 4.7z" fill="#ff6b8b"/></svg>
        히어로 기지
      </button>
      <button class="big-btn" id="btnGo">출동!</button>
    </div>
  </div>
</section>

<!-- 보호자 메뉴 -->
<section id="parent" class="screen">
  <div class="card pcard">
    <div class="phead"><h2>보호자 메뉴</h2><button class="btn" id="btnParentClose">닫기</button></div>
    <div class="psec"><h3>놀이 시간</h3><div class="seg" id="segTimer"></div><div class="note" id="timerNote"></div></div>
    <div class="psec"><h3>배경음악</h3><div class="seg" id="segMusic"></div></div>
    <div class="psec"><h3>목소리 녹음</h3>

      b = $('#btnReset');
    if (now - resetArm > 3000) {
      resetArm = now;
      b.textContent = '한 번 더 누르면 지워져요';
      setTimeout(function () {
        if (performance.now() - resetArm >= 2900) b.textContent = '모든 기록 지우기';
      }, 3000);
      return;
    }
    resetArm = 0;
    b.textContent = '모든 기록 지우기';
    Object.assign(G, {
      total: 0,
      friends: 0,
      level: 0,
      levelStars: 0,
      rescued: {},
      allDone: false,
      newIds: [],
      theme: 0,
      stars: [],
      friendsList: [],
      clouds: [],
      bubbles: [],
      rstar: null,
      flyers: [],
      unlockQueue: [],
      celebrate: 0,
      playSec: 0
    });
    if (O.wear === 'rainbow') O.wear = 'cape';
    if (O.mark === 'gem') O.mark = 'star';
    O.crown = false;
    O.rocket = false;
    saveOpts();
    saveProg();
    updateHUD();
    renderParent();
    toast('기록을 지웠어요', 1500);
  });

  /* ---------- 게임 시작 ---------- */
  function startPlay() {
    var nm = ($('#nameInput').value || '').trim().slice(0, 6);
    O.name = nm || '이든';
    saveOpts();
    ensureAudio();
    if (SET.timerMin > 0 && restLocked()) {
      show('rest');
      return;
    }
    autoFullscreen();
    show('play');
    target.x = hero.x;
    target.y = hero.y;
    if (G.stars.length < 2) {
      spawnStar(W * 0.55, Math.max(H * 0.42, spawnTop()), -S * 0.25);
      spawnStar(W * 0.78, H * 0.58, -S * 0.3);
    }
    SFX.go();
    sayLine('go', "".concat(O.name, " \uD788\uC5B4\uB85C, \uCD9C\uB3D9! \uC190\uAC00\uB77D\uC73C\uB85C \uBCC4\uC744 \uBAA8\uC544 \uBD10!"), 3);
    toast('출동!', 1100);
    setTimeout(function () {
      if (mode === 'play') toast('별을 모아 봐!', 1600);
    }, 1500);
    updateHUD();
  }
  $('#btnStart').addEventListener('click', function () {
    ensureAudio();
    SFX.pop();
    closeInstall();
    show('maker');
    say('히어로를 꾸며 봐!', 2);
  });
  $('#btnGo').addEventListener('click', startPlay);
  $('#btnBase').addEventListener('click', function () {
    ensureAudio();
    SFX.pop();
    baseReturn = 'maker';
    show('base');
    sayLine(null, '히어로 기지에 온 걸 환영해!', 2);
  });
  $('#heartPill').addEventListener('click', function () {
    ensureAudio();
    SFX.pop();
    baseReturn = 'play';
    show('base');
    sayLine(null, '히어로 기지에 온 걸 환영해!', 2);
  });
  $('#btnBaseBack').addEventListener('click', function () {
    SFX.pop();
    show(baseReturn);
  });
  $('#nameInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      startPlay();
    }
  });
  $('#nameInput').addEventListener('input', function () {
    O.name = ($('#nameInput').value || '').trim().slice(0, 6) || '이든';
  });
  $('#btnHome').addEventListener('click', function () {
    ensureAudio();
    SFX.pop();
    show('maker');
  });
  $('#btnSound').addEventListener('click', function () {
    soundOn = !soundOn;
    store.set('eden-hero-sound', soundOn);
    soundIcon();
    if (soundOn) {
      ensureAudio();
      SFX.pop();
    } else {
      try {
        speechSynthesis.cancel();
      } catch (e) {}
      stopVoices();
    }
  });
  $('#btnInstall').addEventListener('click', function () {
    ensureAudio();
    openInstall();
  });
  $('#btnInstall2').addEventListener('click', function () {
    show('title');
    openInstall();
  });
  $('#btnParentClose').addEventListener('click', function () {
    stopRec();
    show('title');
  });
  holdify($('#btnParent'), 1500, function () {
    ensureAudio();
    closeInstall();
    show('parent');
  });
  holdify($('#btnRestHold'), 2000, function () {
    store.del('eden-hero-rest');
    G.playSec = 0;
    show('title');
  });
  if (!fsOK || isStandalone()) $('#btnFull').style.display = 'none';
  $('#btnFull').addEventListener('click', function () {
    try {
      var fn = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
      var r = fn.call(fsEl);
      if (r && r.catch) r.catch(function () {
        $('#btnFull').style.display = 'none';
      });
    } catch (e) {
      $('#btnFull').style.display = 'none';
    }
  });

  /* ---------- 조작 (터치 · 마우스 · 키보드) ---------- */
  addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    keys[e.key] = true;
    if (/^Arrow/.test(e.key)) e.preventDefault();
  });
  addEventListener('keyup', function (e) {
    keys[e.key] = false;
  });
  function setTargetXY(x, y, touch) {
    target.x = x;
    target.y = y - (touch ? S * 0.45 : 0);
  }
  function onDown(x, y, touch) {
    ensureAudio();
    if (mode === 'play') {
      popAt(x, y);
      setTargetXY(x, y, touch);
    } else if (mode === 'base') baseTap(x, y);
  }
  var lastPD = 0;
  canvas.addEventListener('pointerdown', function (e) {
    if (mode !== 'play' && mode !== 'base') return;
    lastPD = performance.now();
    onDown(e.clientX, e.clientY, e.pointerType !== 'mouse');
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (mode !== 'play') return;
    if (e.pointerType === 'mouse' || e.buttons) setTargetXY(e.clientX, e.clientY, e.pointerType !== 'mouse');
  });
  canvas.addEventListener('touchstart', function (e) {
    if (mode !== 'play' && mode !== 'base') return;
    if (e.cancelable) e.preventDefault();
    var t = e.touches && e.touches[0];
    if (!t) return;
    if (performance.now() - lastPD < 400) {
      if (mode === 'play') setTargetXY(t.clientX, t.clientY, true);
      return;
    }
    onDown(t.clientX, t.clientY, true);
  }, {
    passive: false
  });
  canvas.addEventListener('touchmove', function (e) {
    if (mode !== 'play') return;
    if (e.cancelable) e.preventDefault();
    var t = e.touches && e.touches[0];
    if (t) setTargetXY(t.clientX, t.clientY, true);
  }, {
    passive: false
  });
  if (!window.PointerEvent) {
    canvas.addEventListener('mousedown', function (e) {
      if (mode === 'play' || mode === 'base') onDown(e.clientX, e.clientY, false);
    });
    canvas.addEventListener('mousemove', function (e) {
      if (mode === 'play') setTargetXY(e.clientX, e.clientY, false);
    });
  }
  document.addEventListener('gesturestart', function (e) {
    return e.preventDefault();
  });
  addEventListener('resize', resize);
  addEventListener('orientationchange', function () {
    return setTimeout(resize, 300);
  });
  document.addEventListener('visibilitychange', function () {
    if (!actx) return;
    try {
      if (document.hidden) {
        if (actx.state === 'running') {
          audioWasRunning = true;
          actx.suspend();
        }
        try {
          speechSynthesis.cancel();
        } catch (e) {}
        stopVoices();
      } else if (audioWasRunning) {
        audioWasRunning = false;
        var r = actx.resume();
        if (r && r.catch) r.catch(function () {});
      }
    } catch (e) {}
  });

  /* ---------- 시작 ---------- */
  resize();
  hero.x = W * 0.3;
  hero.y = H * 0.5;
  soundIcon();
  updateHUD();
  show(SET.timerMin > 0 && restLocked() ? 'rest' : 'title');
  if (isKakao && isWeb) {
    try {
      if (!sessionStorage.getItem('eden-kakao')) {
        sessionStorage.setItem('eden-kakao', '1');
        setTimeout(openExternal, 400);
      }
    } catch (e) {}
  }
  setTimeout(function () {
    if (store.get('eden-install-asked', false) || mode !== 'title') return;
    var m = installMode();
    if (m && m !== 'android-manual') openInstall(m);else if (m === 'android-manual') setTimeout(function () {
      if (!store.get('eden-install-asked', false) && mode === 'title' && installMode() === 'android-manual') openInstall('android-manual');
    }, 2500);
  }, 1500);
  var last = performance.now(),
    errShown = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0.016;
    if (dt > 0.05) dt = 0.05;
    T += dt;
    try {
      update(dt);
      render();
      if (mode === 'maker') renderPreview();
    } catch (e) {
      if (window.console) console.error(e);
      if (errShown < 1) {
        errShown++;
        var box = $('#err');
        if (box) {
          box.style.display = 'block';
          box.textContent = '작은 문제가 있었지만 게임은 계속돼요. 이 화면을 찍어 보내주시면 고칠게요 → ' + (e && e.message);
          setTimeout(function () {
            box.style.display = 'none';
          }, 6000);
        }
      }
    }
  }
  requestAnimationFrame(frame);
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { try { navigator.serviceWorker.register('./sw.js', { scope: './' })['catch'](function () {}); } catch (e) {} });
}
</script>
</body>
